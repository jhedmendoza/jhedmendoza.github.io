<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting to post...</title>
    <meta name="robots" content="noindex">
    <script>
      // Redirect legacy post.html?postId=123 to SPA route /post/:postId
      (function(){
        try {
          var params = new URLSearchParams(window.location.search);
          var postId = params.get('postId') || params.get('id') || params.get('ID');
          var slug = params.get('slug') || '';
          if (postId) {
            var target = '/post/' + encodeURIComponent(postId);
            if (slug) target += '?slug=' + encodeURIComponent(slug);
            // replace so back-button doesn't return to this redirect page
            window.location.replace(target);
          } else {
            // fallback home
            window.location.replace('/');
          }
        } catch(e) {
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body>
    Redirecting to post...
  </body>
</html>
