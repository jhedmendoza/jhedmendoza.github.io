<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0563bb"/>
  <!-- CRT monitor body -->
  <rect x="11" y="10" width="42" height="34" rx="5" fill="#fff"/>
  <!-- curved glass screen -->
  <rect x="16" y="15" width="32" height="21" rx="4" fill="#034a8c"/>
  <!-- >_ prompt -->
  <path d="M21.5 21.5l4.5 4-4.5 4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M29.5 30h8" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <!-- bezel: floppy slot + power knobs -->
  <rect x="16" y="38.5" width="11" height="2.5" rx="1.25" fill="#0563bb"/>
  <circle cx="41" cy="39.75" r="1.6" fill="#0563bb"/>
  <circle cx="46" cy="39.75" r="1.6" fill="#0563bb"/>
  <!-- stand -->
  <rect x="27" y="44" width="10" height="4" fill="#fff"/>
  <rect x="19" y="47.5" width="26" height="5.5" rx="2.75" fill="#fff"/>
</svg>
