<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 48 48">
  <!-- CRT monitor body (transparent background) -->
  <rect x="11" y="10" width="42" height="34" rx="5" fill="#0563bb"/>
  <!-- curved glass screen -->
  <rect x="16" y="15" width="32" height="21" rx="4" fill="#fff"/>
  <!-- >_ prompt -->
  <path d="M21.5 21.5l4.5 4-4.5 4" fill="none" stroke="#0563bb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M29.5 30h8" stroke="#0563bb" stroke-width="3" stroke-linecap="round"/>
  <!-- bezel: floppy slot + power knobs -->
  <rect x="16" y="38.5" width="11" height="2.5" rx="1.25" fill="#fff"/>
  <circle cx="41" cy="39.75" r="1.6" fill="#fff"/>
  <circle cx="46" cy="39.75" r="1.6" fill="#fff"/>
  <!-- stand -->
  <rect x="27" y="44" width="10" height="4" fill="#0563bb"/>
  <rect x="19" y="47.5" width="26" height="5.5" rx="2.75" fill="#0563bb"/>
</svg>
